# Builds the Windows app (dist/AgroApp.exe) on a Windows machine.
# Runs on every push to main, or by hand from the repo's Actions tab ("Run workflow").
# Download the result from the run's page, under "Artifacts" -> AgroApp-windows.
name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller --noconfirm AgroApp.spec

      - uses: actions/upload-artifact@v4
        with:
          name: AgroApp-windows
          path: dist/AgroApp.exe
